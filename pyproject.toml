[project]
name = "ha-portainer-swarm-monitor"
version = "0.1.0"
description = "Read-only Docker Swarm monitoring for Home Assistant via Portainer"
requires-python = ">=3.14.2"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[dependency-groups]
dev = [
  "homeassistant==2026.7.3",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-homeassistant-custom-component>=0.13.300",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]
